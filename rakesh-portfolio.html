ive AI",text:"On the Generative AI side I have hands-on experience with LLMs, embeddings, vector databases and end-to-end AI pipelines, working with OpenAI, LLaMA, Qwen and Gemma models. I build recommendation systems, automation tools and AI-powered assistants — from RAG-based knowledge assistants and enterprise chatbots to real-time voice bots."},{label:"Applications",text:"I aim for practical, production-ready AI applications: multi-channel content generation for banking and insurance clients, conversational AI with retrieval, intent recognition and context-aware memory, and multilingual, low-latency voice experiences."},{label:"Approach",text:"I enjoy solving real-world problems with technology and optimizing systems for efficiency and performance. I keep learning as AI advances, and I like turning new capabilities into dependable, practical software."}]},_l="data:application/pdf;base64,JVBERi0xLjQKJaqrrK0KMSAwIG9iago8PAovVGl0bGUgKFJlc3VtZSkKL0F1dGhvciAoTGlua2VkSW4pCi9TdWJqZWN0IChSZXN1bWUgZ2VuZXJhdGVkIGZyb20gcHJvZmlsZSkKL1Byb2R1Y2VyIChBcGFjaGUgRk9QIFZlcnNpb24gMi4zKQovQ3JlYXRpb25EYXRlIChEOjIwMjYxMTAzMDQyNDA4WikKPj4KZW5kb2JqCjIgMCBvYmoKPDwKICAvTiAzCiAgL0xlbmd0aCAzIDAgUgogIC9GaWx0ZXIgL0ZsYXRlRGVjb2RlCj4+CnN0cmVhbQp4nO2ZZ1BUWRaA73udEw3dTZOhyUmihAYk5yRBsqhAd5NpoclBUWRwBEYQEUmKIKKAA44OQUZREcWAKCigok4jg4AyDo4iKipL44/ZrfmxtVVb+2f7/Hjvq3NPvXPuq1v1vqoHgAwxnpWQDOsDkMBN4fk62zGCgkMYmAcAC0iACCgAHc5KTrT19vYAqyGoBX+L92MAEtzv6wjWc8+Roos+6Bgem3F5/Haiecvf6/8liOwELhsAiLbKsWxOMmuVd61yNDuBLcjPCjg9JTEFANh7lWm81QFXmS3giG+cIeCob1y8VuPna7/KxwDAEqPWGH9awBFrTOkWMCualwCAdP9qvQorkbf6fGlBL8VvM6yFqGA/jCgOl8MLT+GwGf9mK/95/FMvVPLqy/+vN/gf9xGcnW/01nLtTED0yr9y28sBYL4GAFH6V07lCADkPQB09v6VizgBQFcpAJLPWKm8tG855NrsAA/IgAakgDxQBhpABxgCU2ABbIAjcANewA8Eg62ABaJBAuCBdJADdoMCUARKwSFQDepAI2gGbeAs6AIXwBVwHdwG98AomAB8MA1egQXwHixDEISBSBAVkoIUIFVIGzKEmJAV5Ah5QL5QMBQGRUFcKBXKgfZARVAZVA3VQ83QT9B56Ap0ExqGHkGT0Bz0J/QJRsBEmAbLwWqwHsyEbWF32A/eAkfBSXAWnA/vhyvhBvg03AlfgW/DozAffgUvIgCCgKAjFBE6CCbCHuGFCEFEIniInYhCRAWiAdGG
